# Configuração do Netlify: site estático, sem etapa de build.
[build]
  publish = "."

# Página: o navegador sempre confere se há versão nova antes de mostrar.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Imagens e vídeo seguem o padrão do Netlify (conferência a cada visita),
# para que uma foto trocada apareça na hora, no celular e no computador.

# Fontes: não mudam, guardadas por 1 ano.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
